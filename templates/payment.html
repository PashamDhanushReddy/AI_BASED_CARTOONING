{% extends "base.html" %}
{% block content %}
<h2 class="section-title">Secure Payment</h2>

<div class="payment-container">
  <div class="card animate cta-card">
    <p class="cta-text">Amount: <strong>${{ "%.2f"|format(amount) }}</strong></p>
    
    <form method="POST" class="payment-form">
      <label for="name">Cardholder Name</label>
      <input type="text" id="name" name="name" placeholder="John Doe" required>

      <label for="card">Card Number</label>
      <input type="text" id="card" name="card" placeholder="1234 5678 9012 3456" maxlength="19" required>

      <div class="card-row">
        <div>
          <label for="expiry">Expiry</label>
          <input type="text" id="expiry" name="expiry" placeholder="MM/YY" maxlength="5" required>
        </div>
        <div>
          <label for="cvv">CVV</label>
          <input type="text" id="cvv" name="cvv" placeholder="123" maxlength="3" required>
        </div>
      </div>

      <button type="submit" class="button button-primary">💳 Pay Now</button>
    </form>

    <small class="muted">This is a simulated payment for demo purposes.</small>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  // Scroll-triggered animation
  const animateElements = document.querySelectorAll('.animate');

  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('active');
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.2 });

  animateElements.forEach(el => observer.observe(el));
</script>
{% endblock %}
